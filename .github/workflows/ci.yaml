name: Backend CI

on:
  push:
    branches: [ master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'


jobs:
  lint:
    name: go linters dataIntegrator
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/dataIntegrator

    steps:
      - name: CheckOut
        uses: actions/checkout@v6

      - name: Install GO
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          cache-dependency-path: ./backend/dataIntegrator/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend/dataIntegrator