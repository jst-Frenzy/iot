version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: iot-postgres
    environment:
      POSTGRES_DB: iot_db
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U iot_user -d iot_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iot-network

  temperature-sensor:
    build:
      context: ./backend/temperatureSensor
      dockerfile: Dockerfile
    container_name: iot-temperature-sensor
    ports:
      - "8091:8091"
    depends_on:
      - postgres
    networks:
      - iot-network

  wet-sensor:
    build:
      context: ./backend/wetSensor
      dockerfile: Dockerfile
    container_name: iot-wet-sensor
    ports:
      - "8092:8092"
    depends_on:
      - postgres
    networks:
      - iot-network

  fan:
    build:
      context: ./backend/fan
      dockerfile: Dockerfile
    container_name: iot-fan
    ports:
      - "8093:8093"
    depends_on:
      - postgres
    networks:
      - iot-network

  pump:
    build:
      context: ./backend/pump
      dockerfile: Dockerfile
    container_name: iot-pump
    ports:
      - "8094:8094"
    depends_on:
      - postgres
    networks:
      - iot-network

  data-integrator:
    build:
      context: ./backend/dataIntegrator
      dockerfile: Dockerfile
    container_name: iot-data-integrator
    ports:
      - "8090:8090"
      - "8099:8099"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=iot_db
      - POSTGRES_USER=iot_user
      - POSTGRES_PASSWORD=iot_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iot-network

  data-controller:
    build:
      context: ./backend/dataController
      dockerfile: Dockerfile
    container_name: iot-data-controller
    ports:
      - "8095:8095"
    depends_on:
      - temperature-sensor
      - wet-sensor
      - data-integrator
    networks:
      - iot-network

volumes:
  postgres_data:

networks:
  iot-network:
    driver: bridge
