syntax = "proto3";

package fan;

option go_package = "github.com/jst-Frenzy/iot/backend/fan/api/grpc/gen;fan";

service fanService {
  rpc On(OnRequest) returns (OnResponse);
  rpc Off(OffRequest) returns (OffResponse);
}

message OnRequest{}

message OnResponse{}

message OffRequest{}

message OffResponse{}