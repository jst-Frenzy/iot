syntax = "proto3";

package wetSensor;

option go_package = "github.com/jst-Frenzy/iot/backend/wetSensor/api/grpc/gen;wetSensor";

service WetSensorService {
  rpc GetData(GetDataRequest) returns (GetDataResponse);
  rpc ChangeMode(ChangeModRequest) returns (ChangeModResponse);
}

message GetDataRequest{}

message GetDataResponse{
  int32 data = 1;
}

message ChangeModRequest{}

message ChangeModResponse{}
