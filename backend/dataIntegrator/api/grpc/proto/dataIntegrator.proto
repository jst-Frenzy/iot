syntax = "proto3";

package dataIntegrator;

option go_package = "github.com/jst-Frenzy/iot/backend/dataIntegrator/api/grpc/gen;dataIntegrator";

service DataIntegratorService {
  rpc acceptData(acceptDataRequest) returns (acceptDataResponse);
}

message acceptDataRequest{
  int32 wet = 1;
  int32 temperature = 2;
}

message acceptDataResponse{}